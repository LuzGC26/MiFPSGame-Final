plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.miempresa.mifpsgame'
    compileSdk {
        version = release(37)
    }

    aaptOptions {
        noCompress "j3o", "bvhist", "mesh.xml", "skeleton.xml"
    }
    defaultConfig {
        applicationId "com.miempresa.mifpsgame"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    // jMonkeyEngine Core
    implementation 'org.jmonkeyengine:jme3-core:3.6.1-stable'
    implementation 'org.jmonkeyengine:jme3-android:3.6.1-stable'
    implementation 'org.jmonkeyengine:jme3-android-native:3.6.1-stable'

    // Fisica con JBullet (Version Java pura para Android que evita los errores nativos)
    implementation 'org.jmonkeyengine:jme3-jbullet:3.6.1-stable'

    // Efectos visuales
    implementation 'org.jmonkeyengine:jme3-effects:3.6.1-stable'
}